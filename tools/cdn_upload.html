<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CDN Upload - Simple Patches</title>
        <style>
            :root {
                --accent: rgb(40, 120, 200);
                --background: color-mix(in srgb, var(--accent) 15%, transparent 85%);
                --border: color-mix(in srgb, var(--accent) 25%, transparent 75%);

                --green: #50cd89;
                --blue: #3E97FF;
                --purple: #7239ea;
                --yellow: #ffc700;
                --red: #f1416c;
            }

            *,*::before,*::after { box-sizing: border-box; }
            html { margin: 0; padding: 0; min-width: 100%; min-height: 100%; font-size: 14px; }
            body { margin: 0; padding: 0; padding-top: 1.5rem; padding-bottom: 1rem; min-width: 100%; min-height: 100vh; display: flex; flex-direction: column; gap: 1.5rem; align-items: center; font-family: system-ui, sans-serif; }
            header,main,footer { width: 90%; max-width: 1200px; }

            h1,h2,h3,h4,h5,p { padding: 0; margin: 0; }

            button, .button { text-decoration: none !important; appearance: none; padding: 0.5rem 1rem; border: 1px solid var(--accent); border-radius: 0.5rem; background: var(--accent); color: white; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; }
            button:hover, .button:hover { background-color: color-mix(in srgb, var(--accent) 85%, black 15%); box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 30%, transparent); }
            button:active, .button:active { transform: translateY(1px); box-shadow: none; }
            button:focus-visible, .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
            button:disabled, .button:disabled { opacity: 0.5; cursor: not-allowed; }
            button.secondary { background: white; color: var(--accent); }
            button.secondary:hover { background: var(--background); }
            button.danger { background: var(--red); border-color: var(--red); }
            button.danger:hover { background-color: color-mix(in srgb, var(--red) 85%, black 15%); }

            input { padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: white; color: inherit; font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
            input:hover { border-color: var(--accent); }
            input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
            input:disabled { opacity: 0.5; cursor: not-allowed; }
            input::file-selector-button { margin: -0.5rem 0.75rem -0.5rem -0.75rem; padding: 0.5rem 0.75rem; border: none; border-right: 1px solid var(--border); background: var(--background); color: inherit; font-family: inherit; font-weight: 700; cursor: pointer; }
            input::file-selector-button:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); }
            textarea { width: 100%; min-height: 260px; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: white; color: inherit; font-family: inherit; font-size: 1rem; line-height: 1.5; outline: none; resize: vertical; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
            textarea:hover { border-color: var(--accent); }
            textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
            select { padding: 0.5rem 2rem 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem; background: white; color: inherit; font-family: inherit; font-size: 1rem; outline: none; cursor: pointer; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
            select:hover { border-color: var(--accent); }
            select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
            select:disabled { opacity: 0.5; cursor: not-allowed; }

            table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; }
            th, td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
            th { background: var(--background); font-weight: 700; }
            td { overflow-wrap: anywhere; }
            tbody tr:last-child td { border-bottom: none; }
            tbody tr:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
            textarea:disabled { opacity: 0.5; cursor: not-allowed; }

            .column,.row,.wrap { gap: var(--gap); }
            .column { display: flex; flex-direction: column; }
            .row { display: flex; flex-direction: row; }
            .wrap { display: flex; flex-wrap: wrap; }
            .spacer { flex: 1 1 0; min-width: 0; }
            .box { padding: 1rem; border-radius: 0.75rem; background-color: var(--background); }
            .border { border: 1px solid var(--border); }
            .gapXL { --gap: 1.5rem; }
            .gapL { --gap: 1rem; }
            .gapM { --gap: 0.5rem; }
            .gapS { --gap: 0.25rem; }
            .gapT { --gap: 0.1rem; }
            .row > .line { margin-right: var(--gap); padding-right: var(--gap); border: none; border-right: 1px solid var(--border); height: 100%; }
            .column > .line { margin-bottom: var(--gap); padding-bottom: var(--gap); border: none; border-bottom: 1px solid var(--border); width: 100%; }
            .center { align-items: center; justify-content: center; }
            .hidden { display: none; }

            #error_modal, #action_modal, #password_modal { border: none; border-radius: 0.75rem; padding: 1.5rem; min-width: 300px; max-width: 90%; box-shadow: 0 5px 30px rgba(0, 0, 0, 0.25); }
            #error_modal::backdrop, #action_modal::backdrop, #password_modal::backdrop { background: rgba(0, 0, 0, 0.5); }
            #error_modal[open], #action_modal[open], #password_modal[open] { animation: dialogOpen 0.1s ease-out forwards; }
            #error_modal.closing, #action_modal.closing, #password_modal.closing { animation: dialogClose 0.07s ease-in forwards; }
            #error_modal::backdrop, #action_modal::backdrop, #password_modal::backdrop { background: rgba(0, 0, 0, 0.5); animation: backdropOpen 0.2s ease-out forwards; }
            #error_modal.closing::backdrop, #action_modal.closing::backdrop, #password_modal.closing::backdrop { animation: backdropClose 0.07s ease-in forwards; }
            @keyframes dialogOpen {
                from { opacity: 0; transform: scale(0.85); }
                to { opacity: 1; transform: scale(1); }
            }
            @keyframes dialogClose {
                from { opacity: 1; transform: scale(1); }
                to { opacity: 0; transform: scale(0.85); }
            }
            @keyframes backdropOpen {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes backdropClose {
                from { opacity: 1; }
                to { opacity: 0; }
            }

            /* page specific */
            .dropzone { width: 100%; padding: 2rem; border: 2px dashed var(--border); border-radius: 0.75rem; background: white; text-align: center; cursor: pointer; transition: border-color 0.15s ease, background-color 0.15s ease; }
            .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, white); }
            .status { font-size: 0.9rem; opacity: 0.7; }
            .queue { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; }
            .file-row { width: 100%; padding: 0.75rem; display: flex; gap: 1rem; align-items: center; border: 1px solid var(--border); border-radius: 0.5rem; background: white; }
            .file-thumb { width: 48px; height: 48px; flex: 0 0 48px; object-fit: cover; border-radius: 0.5rem; }
            .file-info { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
            .file-info a { color: var(--accent); }
            .file-actions { flex: 0 0 auto; display: flex; gap: 0.5rem; }
            .file-actions button { padding: 0.3rem 0.6rem; font-size: 0.9rem; }
            .error-text { color: var(--red); font-size: 0.9rem; min-height: 1.2em; }
        </style>
    </head>
    <body>
        <header class="box column gapM" id="header">
            <h1 class="line">Simple Patches Asset Uploader</h1>
            <p style="margin-bottom: 1rem;">Upload files to get a CDN link to paste in code, or anywhere I guess.</p>
            <div class="column gapT spacer">
                <div class="dropzone" id="dropzone">
                    <p>Click or drag and drop a file here</p>
                    <input type="file" id="fileInput" style="display: none;" />
                </div>
                <div class="status" id="status">Waiting for input...</div>
            </div>
        </header>
        <main class="box wrap center gapM" id="main">
            <div class="queue" id="queue"></div>
        </main>
        <main class="box column gapM" id="filemanager">
            <div class="row center">
                <h2>Files</h2>
                <span class="spacer"></span>
                <button type="button" class="secondary" id="refresh_files">Refresh</button>
            </div>
            <div class="status" id="filemanager_status">Loading files...</div>
            <table id="filemanager_table" class="hidden">
                <thead>
                    <tr>
                        <th>Filename</th>
                        <th>Size</th>
                        <th>Uploaded</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="filemanager_body"></tbody>
            </table>
        </main>
        <footer class="box column gapM hidden" id="footer"></footer>

        <dialog id="error_modal">
            <div class="column gapL">
                <h2>Error</h2>
                <h4 id="error_modal_message"></h4>
                <div class="row">
                    <span class="spacer"></span>
                    <button type="button" id="error_modal_close">OK</button>
                    <span class="spacer"></span>
                </div>
            </div>
        </dialog>

        <dialog id="password_modal">
            <div class="column gapL">
                <h2>Enter Password</h2>
                <p>This page requires a password to view and manage files.</p>
                <div class="column gapT">
                    <input type="password" id="password_modal_input" placeholder="Password">
                    <p class="error-text" id="password_modal_error"></p>
                </div>
                <div class="row">
                    <span class="spacer"></span>
                    <button type="button" id="password_modal_confirm">Continue</button>
                </div>
            </div>
        </dialog>

        <dialog id="action_modal">
            <div class="column gapL">
                <h2 id="action_modal_title">Confirm</h2>
                <p id="action_modal_target" class="status"></p>
                <div class="column gapT" id="action_modal_filename_group">
                    <label for="action_modal_filename">New filename:</label>
                    <input type="text" id="action_modal_filename">
                </div>
                <div class="row">
                    <span class="spacer"></span>
                    <button type="button" class="secondary" id="action_modal_cancel">Cancel</button>
                    <button type="button" id="action_modal_confirm">Confirm</button>
                </div>
            </div>
        </dialog>

        <script type="text/javascript">(async function() {
            const API_URL = '/api/cdn';

            // error dialog stuff
            const error_modal = document.getElementById('error_modal');
            const error_modal_message = document.getElementById('error_modal_message');
            const error_modal_close = document.getElementById('error_modal_close');
            function showError(message) {
                error_modal_message.textContent = message;
                error_modal.showModal();
            }
            error_modal_close.addEventListener('click', () => {
                if (error_modal.classList.contains('closing')) return;
                error_modal.classList.add('closing');
                error_modal.addEventListener('animationend', () => {
                    error_modal.close();
                    error_modal.classList.remove('closing');
                }, { once: true });
            });

            // build info
            const script_version = document.createElement('script');
            script_version.src = "https://simple-patches.vercel.app/buildInfo.js?v=" + Date.now();
            script_version.onload = function() { console.debug('Build Info:', window.BUILD_INFO); };
            document.body.appendChild(script_version);

            // password gate
            let uploadPassword = null;

            const password_modal = document.getElementById('password_modal');
            const password_modal_input = document.getElementById('password_modal_input');
            const password_modal_confirm = document.getElementById('password_modal_confirm');
            const password_modal_error = document.getElementById('password_modal_error');

            // don't let the user dismiss the password prompt without entering one
            password_modal.addEventListener('cancel', (e) => e.preventDefault());

            function promptForPassword(errorMessage) {
                return new Promise((resolve) => {
                    password_modal_error.textContent = errorMessage || '';
                    password_modal_input.value = '';
                    password_modal.showModal();
                    password_modal_input.focus();

                    function onConfirm() {
                        const val = password_modal_input.value.trim();
                        if (!val) return;
                        cleanup();
                        password_modal.close();
                        resolve(val);
                    }
                    function onKeydown(e) {
                        if (e.key === 'Enter') onConfirm();
                    }
                    function cleanup() {
                        password_modal_confirm.removeEventListener('click', onConfirm);
                        password_modal_input.removeEventListener('keydown', onKeydown);
                    }

                    password_modal_confirm.addEventListener('click', onConfirm);
                    password_modal_input.addEventListener('keydown', onKeydown);
                });
            }

            // wraps fetch: attaches the stored password, reprompts on 401 and retries once the user re-enters it
            async function apiFetch(url, options = {}) {
                for (;;) {
                    const headers = Object.assign({}, options.headers, { 'x-upload-password': uploadPassword });
                    const res = await fetch(url, Object.assign({}, options, { headers }));
                    if (res.status === 401) {
                        uploadPassword = await promptForPassword('Incorrect password. Please try again.');
                        continue;
                    }
                    return res;
                }
            }

            // start of the cdn manager

            // uploader
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const queue = document.getElementById('queue');

            function createFileRow(url, filename, type) {
                const row = document.createElement('div');
                row.className = 'file-row';
                let thumb;
                if (type.startsWith('image/')) {
                    thumb = document.createElement('img');
                    thumb.src = url;
                    thumb.className = 'file-thumb';
                } else {
                    thumb = document.createElement('div');
                    thumb.textContent = '📄';
                    thumb.className = 'file-thumb';
                    thumb.style.display = 'flex';
                    thumb.style.alignItems = 'center';
                    thumb.style.justifyContent = 'center';
                    thumb.style.fontSize = '1.5rem';
                    thumb.style.background = 'var(--background)';
                }
                const info = document.createElement('div');
                info.className = 'file-info';
                const link = document.createElement('a');
                link.href = url;
                link.textContent = filename;
                link.target = '_blank';
                info.appendChild(link);
                const actions = document.createElement('div');
                actions.className = 'file-actions';
                const copyBtn = document.createElement('button');
                copyBtn.textContent = 'Copy URL';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(url);
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = 'Copy URL';
                    }, 1000);
                };
                actions.appendChild(copyBtn);
                row.appendChild(thumb);
                row.appendChild(info);
                row.appendChild(actions);
                queue.prepend(row);
            }

            async function upload(file) {
                status.textContent = `Uploading ${file.name}...`;
                try {
                    const res = await apiFetch(`${API_URL}?action=upload`, {
                        method: 'POST',
                        headers: {
                            'x-filename': file.name
                        },
                        body: file
                    });
                    const data = await res.json();
                    if (!res.ok || data.error) {
                        status.textContent = 'Upload failed.';
                        console.error(data);
                        showError(data.error || 'Upload failed.');
                        return;
                    }
                    createFileRow(data.url, file.name, file.type);
                    status.textContent = `Uploaded: ${file.name}`;
                    loadFileList();
                } catch (err) {
                    console.error(err);
                    status.textContent = 'Upload failed.';
                    showError('Upload failed.');
                }
            }

            dropzone.addEventListener('click', () => { fileInput.click(); });

            fileInput.addEventListener('change', e => {
                for (const file of e.target.files) {
                    upload(file);
                }
            });

            dropzone.addEventListener('dragover', e => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });

            dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('dragover'); });

            dropzone.addEventListener('drop', e => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                for (const file of e.dataTransfer.files) {
                    upload(file);
                }
            });

            // file manager (list, rename, delete)
            const filemanager_status = document.getElementById('filemanager_status');
            const filemanager_table = document.getElementById('filemanager_table');
            const filemanager_body = document.getElementById('filemanager_body');
            const refresh_files = document.getElementById('refresh_files');

            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const units = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return `${(bytes / Math.pow(1024, i)).toFixed(1)} ${units[i]}`;
            }

            function pathnameToFilename(pathname) {
                return pathname.includes('/') ? pathname.slice(pathname.lastIndexOf('/') + 1) : pathname;
            }

            async function loadFileList() {
                filemanager_status.textContent = 'Loading files...';
                filemanager_table.classList.add('hidden');
                try {
                    const res = await apiFetch(API_URL, { method: 'GET' });
                    const data = await res.json();
                    if (!res.ok || data.error) {
                        filemanager_status.textContent = 'Failed to load files.';
                        showError(data.error || 'Failed to load files.');
                        return;
                    }

                    const blobs = (data.blobs || []).slice().sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));

                    filemanager_body.innerHTML = '';
                    for (const blob of blobs) {
                        const tr = document.createElement('tr');

                        const nameTd = document.createElement('td');
                        const link = document.createElement('a');
                        link.href = blob.url;
                        link.target = '_blank';
                        link.textContent = pathnameToFilename(blob.pathname);
                        link.style.color = 'var(--accent)';
                        nameTd.appendChild(link);

                        const sizeTd = document.createElement('td');
                        sizeTd.textContent = formatBytes(blob.size);

                        const dateTd = document.createElement('td');
                        dateTd.textContent = new Date(blob.uploadedAt).toLocaleString();

                        const actionsTd = document.createElement('td');
                        actionsTd.className = 'file-actions';

                        const renameBtn = document.createElement('button');
                        renameBtn.className = 'secondary';
                        renameBtn.textContent = 'Rename';
                        renameBtn.onclick = () => openActionModal('rename', blob);

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'danger';
                        deleteBtn.textContent = 'Delete';
                        deleteBtn.onclick = () => openActionModal('delete', blob);

                        actionsTd.appendChild(renameBtn);
                        actionsTd.appendChild(deleteBtn);

                        tr.appendChild(nameTd);
                        tr.appendChild(sizeTd);
                        tr.appendChild(dateTd);
                        tr.appendChild(actionsTd);
                        filemanager_body.appendChild(tr);
                    }

                    filemanager_status.textContent = blobs.length ? '' : 'No files uploaded yet.';
                    if (blobs.length) filemanager_table.classList.remove('hidden');
                } catch (err) {
                    console.error(err);
                    filemanager_status.textContent = 'Failed to load files.';
                    showError('Failed to load file list.');
                }
            }

            refresh_files.addEventListener('click', loadFileList);

            // action modal (rename / delete — password already known, just confirm the action)
            const action_modal = document.getElementById('action_modal');
            const action_modal_title = document.getElementById('action_modal_title');
            const action_modal_target = document.getElementById('action_modal_target');
            const action_modal_filename_group = document.getElementById('action_modal_filename_group');
            const action_modal_filename = document.getElementById('action_modal_filename');
            const action_modal_cancel = document.getElementById('action_modal_cancel');
            const action_modal_confirm = document.getElementById('action_modal_confirm');

            let pendingAction = null; // { type: 'rename' | 'delete', blob }

            function openActionModal(type, blob) {
                pendingAction = { type, blob };
                const currentName = pathnameToFilename(blob.pathname);

                if (type === 'rename') {
                    action_modal_title.textContent = 'Rename File';
                    action_modal_target.textContent = `Renaming: ${currentName}`;
                    action_modal_filename_group.classList.remove('hidden');
                    action_modal_filename.value = currentName;
                    action_modal_confirm.textContent = 'Rename';
                    action_modal_confirm.className = '';
                } else {
                    action_modal_title.textContent = 'Delete File';
                    action_modal_target.textContent = `Delete "${currentName}"? This cannot be undone.`;
                    action_modal_filename_group.classList.add('hidden');
                    action_modal_confirm.textContent = 'Delete';
                    action_modal_confirm.className = 'danger';
                }

                action_modal.showModal();
            }

            function closeActionModal() {
                if (action_modal.classList.contains('closing')) return;
                action_modal.classList.add('closing');
                action_modal.addEventListener('animationend', () => {
                    action_modal.close();
                    action_modal.classList.remove('closing');
                    pendingAction = null;
                }, { once: true });
            }

            action_modal_cancel.addEventListener('click', closeActionModal);

            action_modal_confirm.addEventListener('click', async () => {
                if (!pendingAction) return;
                const { type, blob } = pendingAction;
                action_modal_confirm.disabled = true;

                try {
                    let res;
                    if (type === 'delete') {
                        res = await apiFetch(`${API_URL}?action=delete`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: blob.url })
                        });
                    } else {
                        const newFilename = action_modal_filename.value.trim();
                        if (!newFilename) {
                            showError('Please enter a new filename.');
                            action_modal_confirm.disabled = false;
                            return;
                        }
                        res = await apiFetch(`${API_URL}?action=rename`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ fromUrl: blob.url, newFilename })
                        });
                    }

                    const data = await res.json();
                    if (!res.ok || data.error) {
                        showError(data.error || `${type === 'delete' ? 'Delete' : 'Rename'} failed.`);
                        action_modal_confirm.disabled = false;
                        return;
                    }

                    closeActionModal();
                    action_modal_confirm.disabled = false;
                    loadFileList();
                } catch (err) {
                    console.error(err);
                    showError(`${type === 'delete' ? 'Delete' : 'Rename'} failed.`);
                    action_modal_confirm.disabled = false;
                }
            });

            // entry point: get the password before doing anything else
            uploadPassword = await promptForPassword();
            loadFileList();
        })();</script>
    </body>
</html>
